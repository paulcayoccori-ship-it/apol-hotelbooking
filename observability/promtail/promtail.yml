server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # Logs de contenedores Docker del proyecto hotelbooking
  - job_name: docker-hotelbooking
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Solo contenedores del proyecto apol-hotelbooking
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'apol-hotelbooking'
        action: keep
      # Nombre del contenedor como label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Stream (stdout/stderr)
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      # Label de proyecto
      - target_label: project
        replacement: hotelbooking
    pipeline_stages:
      - docker: {}
