# ============================================================
# ms-notification-service — perfil DEV
# Puerto: 8085 | DB: db_hotel_notification
# Envío: simulado (log) — sin mail real ni Kafka todavía
# ============================================================

server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3311}/db_hotel_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # TODO fase Mail — descomentar cuando se active spring-boot-starter-mail en pom.xml
  # mail:
  #   host: ${MAIL_HOST:localhost}
  #   port: ${MAIL_PORT:1025}
  #   username: ${MAIL_USERNAME:}
  #   password: ${MAIL_PASSWORD:}
  #   properties:
  #     mail.smtp.auth: false
  #     mail.smtp.starttls.enable: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:7081/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# TODO fase Feign — activar cuando se agregue @EnableFeignClients
feign:
  client:
    config:
      ms-booking-service:
        connect-timeout: 5000
        read-timeout: 5000
