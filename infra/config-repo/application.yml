# =============================================================
# Configuración GLOBAL compartida por TODOS los microservicios
# =============================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,refresh
  endpoint:
    health:
      show-details: always

spring:
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

logging:
  level:
    root: INFO
    com.hotelbooking: DEBUG
    org.hibernate.SQL: DEBUG
