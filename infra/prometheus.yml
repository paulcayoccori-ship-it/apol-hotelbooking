global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: ms-user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: ms-room-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8082']

  - job_name: ms-booking-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8083']

  - job_name: ms-payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8084']

  - job_name: ms-notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8085']

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:7091']

  - job_name: registry-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:7081']

  - job_name: config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:7071']
