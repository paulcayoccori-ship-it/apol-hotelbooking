server:
  port: 7081

spring:
  application:
    name: registry-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # optional: no falla si config-server no está disponible al arrancar
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:7071}

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    health:
      show-details: always
