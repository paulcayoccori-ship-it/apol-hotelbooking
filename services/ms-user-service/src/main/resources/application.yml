server:
  port: 8081

spring:
  application:
    name: ms-user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # Importa config de config-server. "optional:" evita fallo si no está disponible.
    # En dev local arrancar config-server antes que este servicio.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:7071}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,refresh
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ms-user-service
    version: 1.0.0
    description: User management microservice - HotelBooking
