<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">

    <h1 class="text-2xl font-bold text-gray-800 mb-1">Iniciar sesión</h1>
    <p class="text-gray-500 text-sm mb-6">Accede para continuar con tu reserva</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Número de documento (DNI / Carnet)
        </label>
        <input
          formControlName="documentNumber"
          type="text"
          placeholder="Ej. 12345678"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <p *ngIf="form.get('documentNumber')?.invalid && form.get('documentNumber')?.touched"
           class="text-red-500 text-xs mt-1">Ingresa tu número de documento.</p>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input
          formControlName="password"
          type="password"
          placeholder="Tu contraseña"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <p *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
           class="text-red-500 text-xs mt-1">Ingresa tu contraseña.</p>
      </div>

      <div *ngIf="error" class="mb-4 bg-red-50 text-red-600 text-sm rounded-lg px-4 py-3">
        {{ error }}
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-semibold py-2 rounded-lg transition"
      >
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      ¿No tienes cuenta?
      <a routerLink="/client-register" class="text-blue-600 hover:underline font-medium">Regístrate aquí</a>
    </p>

    <p class="text-center text-sm text-gray-400 mt-2">
      <a routerLink="/rooms" class="hover:underline">Volver a habitaciones</a>
    </p>

  </div>
</div>
