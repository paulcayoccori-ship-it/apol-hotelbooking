<div class="page">
  <div class="page-header">
    <h2 class="page-title">Dashboard</h2>
    <p class="page-subtitle">Resumen general del sistema hotelero</p>
  </div>

  @if (error) {
    <div class="alert alert-danger">&#9888; {{ error }}</div>
  }

  @if (loading) {
    <div class="loading-grid">
      @for (i of [1,2,3,4,5,6]; track i) {
        <div class="stat-card skeleton"></div>
      }
    </div>
  } @else {
    <div class="stat-grid">
      @for (card of cards; track card.label) {
        <div class="stat-card">
          <div class="stat-icon" [style.background]="card.color + '18'" [style.color]="card.color">
            <span [innerHTML]="card.icon"></span>
          </div>
          <div class="stat-info">
            <div class="stat-value" [style.color]="card.color">{{ card.value }}</div>
            <div class="stat-label">{{ card.label }}</div>
            @if (card.sublabel) {
              <div class="stat-sublabel">{{ card.sublabel }}</div>
            }
          </div>
        </div>
      }
    </div>

    <div class="refresh-area">
      <button class="btn btn-outline" (click)="load()">&#8635; Actualizar datos</button>
    </div>
  }
</div>
