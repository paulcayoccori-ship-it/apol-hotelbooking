<div class="login-page">
  <div class="login-card">
    <div class="login-logo">&#127968;</div>
    <h1 class="login-title">HotelBooking</h1>
    <p class="login-subtitle">Panel de administración</p>

    @if (error) {
      <div class="alert alert-danger">{{ error }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="login()">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" formControlName="username" placeholder="Ej: admin" autocomplete="username" />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button type="submit" class="btn-login" [disabled]="form.invalid || loading">
        @if (loading) { Ingresando... } @else { Ingresar al sistema }
      </button>
    </form>

    <div class="login-info">
      <p>&#128274; Autenticación via Keycloak — Realm: <strong>hotelbooking</strong></p>
      <p>Keycloak: <code>http://localhost:8180</code></p>
    </div>
  </div>
</div>
