<div class="login-page">
  <div class="login-card">
    <div class="login-logo">&#127968;</div>
    <h1 class="login-title">HotelBooking</h1>
    <p class="login-subtitle">Panel de administración</p>

    @if (error) {
      <div class="alert alert-danger">{{ error }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="login()">
      <div class="form-group">
        <label>Nombre de usuario</label>
        <input type="text" formControlName="userName" placeholder="Ej: Administrador" />
      </div>

      <div class="form-group">
        <label>Token JWT</label>
        <textarea formControlName="token" rows="5"
          placeholder="Pega aquí tu token de acceso obtenido desde Keycloak (http://localhost:8180)">
        </textarea>
        <small>Obtén tu token desde Keycloak → Realm: <strong>hotelbooking</strong></small>
      </div>

      <button type="submit" class="btn-login" [disabled]="form.invalid">
        Ingresar al sistema
      </button>
    </form>

    <div class="login-info">
      <p>&#128274; Las rutas están protegidas por Keycloak</p>
      <p>Keycloak: <code>http://localhost:8180</code></p>
    </div>
  </div>
</div>
